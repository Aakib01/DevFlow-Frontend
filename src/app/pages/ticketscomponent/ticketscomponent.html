<div style="display: flex; gap: 20px;">

  <div *ngFor="let state of states" style="width: 30%; border: 1px solid #ccc; padding: 10px;">
    
    <h3>{{state}}</h3>

    <div *ngFor="let t of getTicketsByState(state)" 
         style="border: 1px solid black; margin: 5px; padding: 5px;">
      
      <p>{{t.title}}</p>

    <!-- Dynamic transitions -->
      <div *ngIf="transitionsMap[t.id]">
        <button *ngFor="let tr of transitionsMap[t.id]"
                (click)="move(t.id, tr.id)">
          Move to {{tr.name}}
        </button>
      </div>
    </div>

  </div>

</div>
